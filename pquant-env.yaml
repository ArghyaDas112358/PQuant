name: pquant-gpu-env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - ipykernel
  - pyyaml>=6.0.1
  - keras>=3
  - pytorch=2.1
  - torchvision
  - torchaudio
  - pip:
      - tensorflow==2.15.*
      - quantizers>=1.1
      - git+https://github.com/calad0i/HGQ2.git
